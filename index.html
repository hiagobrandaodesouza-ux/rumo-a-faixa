<body>
<title>Rumo à Faixa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular numa coluna, faixa vermelha da B9 no topo, navegação fixa embaixo */
:root{
  --bg:#F4F2F1; --surface:#FFFFFF; --surface-2:#EDE9E8; --ink:#1B1516; --muted:#6E6466; --line:#DDD6D5;
  --red:#D3121B; --red-ink:#FFFFFF; --blue:#1C5FC9; --blue-soft:#DCE7FA; --gold:#F2C300;
  --ok:#1D8A4E; --ok-soft:#DDF3E6; --bad:#C8261E; --bad-soft:#FBE2E0;
  --gi-you:#2E6FD8; --gi-you-line:#123F87; --gi-op:#FFFFFF; --gi-op-line:#4A4245; --mat:#E7E1DF;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1F1A1C; --surface-2:#2A2427; --ink:#F4EDEE; --muted:#A99EA1; --line:#3A3236;
  --red:#E3242C; --red-ink:#FFFFFF; --blue:#6FA2F5; --blue-soft:#1D2C47; --gold:#F2C300;
  --ok:#4CC783; --ok-soft:#173527; --bad:#FF6B61; --bad-soft:#40201E;
  --gi-you:#3F7FE6; --gi-you-line:#A9C8FF; --gi-op:#ECE7E8; --gi-op-line:#ECE7E8; --mat:#2A2427; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1F1A1C; --surface-2:#2A2427; --ink:#F4EDEE; --muted:#A99EA1; --line:#3A3236;
  --red:#E3242C; --red-ink:#FFFFFF; --blue:#6FA2F5; --blue-soft:#1D2C47; --gold:#F2C300;
  --ok:#4CC783; --ok-soft:#173527; --bad:#FF6B61; --bad-soft:#40201E;
  --gi-you:#3F7FE6; --gi-you-line:#A9C8FF; --gi-op:#ECE7E8; --gi-op-line:#ECE7E8; --mat:#2A2427; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* faixa da B9 */
.band{background:var(--red);color:var(--red-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:14px max(16px,env(safe-area-inset-left,0px)) 18px;position:relative;overflow:hidden}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.badge9{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#B00E15;display:grid;place-items:center;font-weight:800;font-size:17px;border:2px solid #fff}
.exam-tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:99px;white-space:nowrap}
.swap{border:2px solid rgba(255,255,255,.7);color:#fff;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.swap i{width:14px;height:14px;border-radius:3px;border:1px solid #fff;display:inline-block}
.count{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.count-num{font-family:var(--display);font-weight:800;font-size:76px;line-height:.8;font-variant-numeric:tabular-nums}
.count-txt{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;padding-bottom:4px}
.count-txt small{display:block;font-family:var(--body);font-weight:500;font-size:13px;text-transform:none;opacity:.9;margin-top:4px}

/* faixa (belt) */
.beltcard{background:var(--surface);border-radius:14px;padding:16px;margin-top:-10px;position:relative;box-shadow:0 6px 20px rgba(40,10,12,.10);display:grid;gap:12px}
.belt-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.belt-row h2{font-size:24px}
.belt-meta{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;gap:10px}
.section-h h2{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.section-h span{font-size:13px;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--surface-2)}
.btn-primary{background:var(--red);color:var(--red-ink)}
.btn-blue{background:var(--blue);color:#fff}
.btn-wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}

.today{background:var(--blue-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px;margin-top:16px}
.today p{margin:0;font-size:14px}
.today b{color:var(--blue)}

/* mapa da prova */
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:6px;min-width:0}
.tile-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.tile em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.tile.weak .bar i{background:var(--red)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:none;padding:6px 2px;border-radius:10px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--red);background:var(--surface-2)}

/* telas */
.screen-h{padding:20px 0 6px;display:grid;gap:4px}
.screen-h h1{font-size:34px;text-transform:uppercase}
.screen-h p{margin:0;color:var(--muted);font-size:14px}
.modes{display:grid;gap:8px;margin-top:12px}
.mode{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.mode-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;font-size:20px;color:#fff}
.mode b{display:block;font-size:15px}
.mode span{font-size:13px;color:var(--muted)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.qtop .bar{flex:1;height:8px}
.xbtn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.qcat{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.qtext{font-size:20px;font-weight:700;line-height:1.3;margin:6px 0 12px;text-wrap:pretty}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:12px}
.figure svg{display:block;width:100%;height:auto}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;max-width:100%}
.yt{background:var(--ink);color:var(--bg);text-decoration:none;margin-top:4px}
.thumb img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px}
.sig{display:grid;place-items:center;aspect-ratio:16/10;border-radius:8px;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em}
.credits{font-size:12px;color:var(--muted);margin-top:18px;display:grid;gap:4px}
.credits a{color:var(--muted)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.5}
.about h2{font-family:var(--display);font-size:20px;margin:0 0 6px;text-transform:uppercase}
.about p{margin:0 0 8px}
.about ul{margin:0;padding-left:18px;display:grid;gap:4px}
.about .credits{margin-top:0}
.order-long .order-picked{display:grid}
.order-long .order-picked .chip,.order-long .row .chip{border-radius:12px;text-align:left;width:100%;font-weight:500;line-height:1.35}
.order-long .row{flex-direction:column;align-items:stretch;gap:6px}
.opts{display:grid;gap:8px}
.opts.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-weight:600;min-width:0}
.opt svg{display:block;width:100%;height:auto}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14px}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase}
.next{margin-top:12px}
.order-picked{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;background:var(--surface-2);border-radius:12px;padding:8px;margin-bottom:10px}
.chip{border:0;border-radius:99px;padding:8px 12px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.belt-chip{display:inline-flex;align-items:center;gap:6px}
.belt-chip i{width:22px;height:10px;border-radius:2px;border:1px solid var(--gi-op-line);display:inline-block}

.result{text-align:center;padding:30px 0;display:grid;gap:10px;justify-items:center}
.result .big{font-family:var(--display);font-weight:800;font-size:80px;line-height:1}

/* técnicas */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{white-space:nowrap;flex:none}
.tlist{display:grid;gap:8px}
.titem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.titem .thumb{width:84px;flex:none;border-radius:8px;position:relative}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.titem .vtag{display:inline;font-size:12px;color:var(--red)}
.titem{min-height:58px}
.titem .thumb svg{display:block;width:100%;height:auto}
.titem b{display:block;font-size:15px;line-height:1.25}
.titem span{font-size:12px;color:var(--muted)}
.titem .info{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--surface-2);border:2px solid var(--line)}
.dot.l1{background:var(--bad);border-color:var(--bad)}
.dot.l2{background:var(--gold);border-color:var(--gold)}
.dot.l3{background:var(--ok);border-color:var(--ok)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,5,6,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet-h h2{font-size:28px;text-transform:uppercase}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.steps li{padding-left:4px}
.warn{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.rate button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:700;font-size:13px}
.rate button.on.l1{border-color:var(--bad);background:var(--bad-soft)}
.rate button.on.l2{border-color:var(--gold)}
.rate button.on.l3{border-color:var(--ok);background:var(--ok-soft)}
.sub{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.media{display:grid;gap:8px}
.media img,.media video{width:100%;border-radius:10px;background:#000}
.file{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:12px;font-weight:600;color:var(--muted);cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);padding:0 6px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* simulado */
.wheel{background:var(--red);color:#fff;border-radius:18px;padding:22px 16px;text-align:center;display:grid;gap:8px;margin-top:12px;min-height:160px;align-content:center}
.wheel .cat{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.wheel .name{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.wheel .sensei{font-size:13px;opacity:.85}
.timer{font-family:var(--display);font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1}
.quote{font-style:italic;color:var(--muted);font-size:14px;border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:24px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</nav>

};

/* Técnicas: pos = posição da ilustração; swap = você (azul) por baixo/por cima invertido */
const TEC_AZUL = [
 // Aquecimento técnico
 {id:"a1",cat:"aquec",nome:"Cambalhotas",pos:"solo",passos:["Agache com as mãos no chão à frente dos pés.","Queixo colado no peito e costas arredondadas.","Role apoiando a nuca e as costas, nunca o topo da cabeça.","Termine sentado ou de pé, em base."],erro:"Apoiar o topo da cabeça no chão."},
 {id:"a2",cat:"aquec",nome:"Emborcadas",pos:"solo",passos:["Deitado de costas, queixo no peito.","Leve as pernas por cima de um dos ombros (não por cima do pescoço).","Passe o corpo para trás apoiando no ombro.","Termine de joelhos ou em base, pronto para continuar."],erro:"Rolar por cima do pescoço. Confirme com o sensei o formato que ele cobra.",confirmar:true},
 {id:"a3",cat:"aquec",nome:"Amortecimentos",pos:"solo",passos:["Queixo no peito para proteger a cabeça.","Caia arredondando as costas.","Bata os braços estendidos no chão a uns 45° do corpo, palmas para baixo.","Faça para trás e para os dois lados."],erro:"Tentar apoiar a queda com a mão ou o cotovelo esticado."},
 {id:"a4",cat:"aquec",nome:"Rolamentos",pos:"solo",passos:["Base com uma perna à frente e o braço do mesmo lado em arco.","Role em diagonal do ombro até o quadril oposto.","Mantenha a cabeça virada para o lado de fora.","Termine em base técnica, de pé."],erro:"Rolar em linha reta sobre a coluna."},
 {id:"a5",cat:"aquec",nome:"Fugas de quadril",pos:"solo",passos:["Deitado de lado, pé de cima apoiado no chão.","Empurre o chão com o pé e leve o quadril para trás.","As mãos empurram para frente, como se afastassem o adversário.","Troque de lado e repita pelo tatame."],erro:"Ficar de costas retas no chão em vez de virar de lado."},
 {id:"a6",cat:"aquec",nome:"Reposição de guarda",pos:"solo",passos:["Deitado, apoie o ombro e o pé no chão.","Gire o quadril usando fuga de quadril.","Traga o joelho para a frente do seu corpo.","Recoloque as pernas entre você e o adversário."],erro:"Deixar as pernas para trás e expor o quadril."},
 {id:"a7",cat:"aquec",nome:"Baratinha",pos:"solo",passos:["De costas no chão, pernas e braços para o alto.","Gire o corpo no chão usando ombros e quadril.","Mantenha os pés sempre virados para o adversário imaginário.","Gire para os dois lados."],erro:"Apoiar a cabeça e travar o giro. Confirme com o sensei o formato que ele cobra.",confirmar:true},
 // Saídas
 {id:"s1",cat:"saidas",nome:"Da montada barrigada (upa)",pos:"montada",swap:true,passos:["Prenda o braço do adversário pelo punho, junto ao seu corpo.","Prenda o pé dele do mesmo lado com o seu pé.","Faça a ponte forte com o quadril, na diagonal, sobre o seu ombro do lado preso.","Gire e termine dentro da guarda dele, com postura."],erro:"Fazer a ponte reta para cima, sem prender braço e pé do mesmo lado."},
 {id:"s2",cat:"saidas",nome:"Do arm lock subindo",pos:"guarda",swap:true,passos:["Junte as mãos e proteja o braço atacado.","Vire o polegar para cima, para o cotovelo não ficar na linha.","Suba empilhando o adversário, levando o peso para cima dele.","Puxe o cotovelo para fora e passe para o lado."],erro:"Puxar o braço para trás com o cotovelo esticado."},
 {id:"s3",cat:"saidas",nome:"Do 100 kg reposição de guarda",pos:"cem",swap:true,passos:["Monte as defesas: antebraço no pescoço e mão no quadril dele.","Fuga de quadril para criar espaço.","Coloque o joelho por dentro, entre você e ele.","Recomponha a guarda com as duas pernas."],erro:"Empurrar com os braços esticados e deixar o peito exposto."},
 {id:"s4",cat:"saidas",nome:"Das costas básica travando o braço",pos:"costas",swap:true,passos:["Proteja o pescoço segurando o braço que vai estrangular.","Trave esse braço no seu peito.","Escorregue o quadril para o lado do braço de baixo e encoste as costas no chão.","Tire o gancho, gire para dentro e fique por cima."],erro:"Soltar o pescoço para tirar os ganchos primeiro."},
 {id:"s5",cat:"saidas",nome:"Do triângulo balde",pos:"guarda",passos:["Postura reta, sem deixar a cabeça ser puxada.","Cotovelo do braço preso colado ao corpo.","Suba e empilhe, levando o peso sobre o quadril dele.","Controle o quadril e passe para o lado do braço preso."],erro:"Ficar parado com a cabeça baixa. Confirme com o sensei o detalhe do \"balde\".",confirmar:true},
 {id:"s6",cat:"saidas",nome:"Do omoplata cambalhota",pos:"guarda",passos:["Assim que sentir a perna dele no seu ombro, não espere o ajuste.","Role para frente (cambalhota) na direção do braço preso.","O giro desfaz a torção do ombro.","Volte para a frente dele, por cima ou na guarda."],erro:"Tentar puxar o braço preso para trás com força."},
 {id:"s7",cat:"saidas",nome:"Do estrangulamento com pegada na gola",pos:"guarda",swap:false,passos:["Queixo para baixo e para o lado da mão de dentro.","Duas mãos no mesmo braço dele, tirando a pressão do punho.","Afaste o cotovelo dele do seu pescoço.","Recupere a postura ou passe para o lado."],erro:"Tentar empurrar o rosto ou o peito dele."},
 {id:"s8",cat:"saidas",nome:"Do mata-leão com pegada nas costas",pos:"costas",swap:true,passos:["Queixo no peito.","Duas mãos no braço que estrangula: punho e cotovelo.","Puxe o braço para baixo e afaste o cotovelo.","Escorregue para o lado do braço, encoste as costas no chão e vire."],erro:"Usar uma mão só."},
 // Quedas
 {id:"q1",cat:"quedas",nome:"Morote-gari (baiana)",pos:"queda",passos:["Baixe o nível dobrando os joelhos, sem dobrar só as costas.","Passo de penetração entre as pernas dele.","Ombro no quadril e mãos atrás dos joelhos.","Puxe as pernas e empurre com o ombro, terminando por cima."],erro:"Abaixar a cabeça olhando o chão."},
 {id:"q2",cat:"quedas",nome:"Single leg",pos:"queda",passos:["Baixe o nível e entre numa perna.","Cabeça colada ao corpo dele, por dentro.","Prenda a perna com as duas mãos na altura do joelho.","Gire ou empurre para derrubar e estabilize por cima."],erro:"Agarrar a perna sem baixar o quadril."},
 {id:"q3",cat:"quedas",nome:"O-soto-gari",pos:"queda",passos:["Pegada na gola e na manga.","Desequilibre para trás, sobre o calcanhar da perna de apoio dele.","Passo ao lado e ceife a perna de apoio por trás com a sua perna.","Acompanhe a queda e estabilize por cima."],erro:"Ceifar sem antes desequilibrar."},
 {id:"q4",cat:"quedas",nome:"O-soto-guruma",pos:"queda",passos:["Mesmo desequilíbrio para trás do o-soto-gari.","A sua perna passa por trás das DUAS pernas dele.","Use a perna como eixo e gire o tronco dele por cima.","Termine por cima, estabilizado."],erro:"Confundir com o o-soto-gari: aqui a perna bloqueia as duas pernas."},
 {id:"q5",cat:"quedas",nome:"Ô-uti-gari (o-uchi-gari)",pos:"queda",passos:["Pegada na gola e na manga.","Desequilibre para trás e um pouco para o lado.","Ceife a perna dele por DENTRO, em semicírculo.","Empurre o tronco para trás e termine por cima."],erro:"Ceifar por fora (isso é o-soto)."},
 // Raspagens
 {id:"r1",cat:"raspagens",nome:"Em pé básica",pos:"guarda",passos:["Adversário fica em pé na sua guarda.","Segure os dois calcanhares dele.","Pé no quadril empurrando enquanto puxa os calcanhares.","Ele cai sentado: levante em base técnica e fique por cima."],erro:"Soltar os calcanhares antes de ele cair."},
 {id:"r2",cat:"raspagens",nome:"Da guarda pêndulo",pos:"guarda",passos:["Pegada na manga e por dentro da perna dele.","Abra a guarda e gire o corpo de lado.","A perna de fora faz o pêndulo, chutando para cima.","Puxe a manga e role para a montada."],erro:"Não girar o corpo antes do pêndulo."},
 {id:"r3",cat:"raspagens",nome:"De meia buscando a perna",pos:"meia",swap:true,passos:["Pegue o underhook (braço por baixo do braço dele).","Fuga de quadril e vá por baixo dele.","Abrace a perna de trás dele.","Levante ou empurre para o lado e fique por cima."],erro:"Ficar de costas no chão sem o underhook."},
 {id:"r4",cat:"raspagens",nome:"Da guarda butterfly (gancho)",pos:"borboleta",passos:["Sentado com ganchos por dentro das coxas dele.","Underhook de um lado e manga do outro.","Caia de lado, para o lado da manga presa.","Eleve o gancho do underhook e role por cima."],erro:"Cair de costas retas em vez de cair de lado."},
 {id:"r5",cat:"raspagens",nome:"Da guarda tesoura",pos:"guarda",passos:["Pegada na gola e na manga do mesmo lado.","Canela atravessada na barriga dele.","Perna de baixo no joelho dele, encostada no chão.","Puxe gola e manga e feche as pernas como tesoura."],erro:"Deixar a manga solta: ele apoia a mão e não cai."},
 // Passagem de guarda
 {id:"p1",cat:"passagem",nome:"Em pé básica",pos:"guarda",swap:true,passos:["Postura reta, mãos no quadril e no peito dele.","Levante um pé de cada vez.","Abra a guarda empurrando o joelho para baixo.","Controle a perna, passe para o lado e estabilize no 100 kg."],erro:"Levantar com a cabeça para frente: ele puxa e quebra a postura."},
 {id:"p2",cat:"passagem",nome:"Subindo",pos:"guarda",swap:true,passos:["Quebre a guarda e suba de pé com postura.","Controle a calça ou o quadril dele.","Desça por cima de uma perna, pressionando.","Estabilize 3 segundos no 100 kg."],erro:"Descer sem controle da perna dele."},
 {id:"p3",cat:"passagem",nome:"Básica empurrando joelho",pos:"guarda",swap:true,passos:["Joelho no cóccix dele para abrir a guarda.","Empurre o joelho dele para baixo com a mão.","Passe o seu joelho por cima da coxa dele.","Controle e estabilize no 100 kg."],erro:"Apoiar a mão dentro da guarda: risco de triângulo e armlock."},
 {id:"p4",cat:"passagem",nome:"Básica com joelho trocado",pos:"guarda",swap:true,passos:["Com a guarda aberta, prenda a coxa dele.","Troque o joelho, cortando por cima da coxa dele.","Controle a gola e o underhook.","Tire a perna presa e estabilize no 100 kg."],erro:"Ficar com o peso para trás."},
 {id:"p5",cat:"passagem",nome:"De meia pesando por cima",pos:"meia",passos:["Crossface (ombro no rosto) e underhook.","Peso no peito dele.","Use o outro pé para soltar o joelho preso.","Libere a perna e estabilize no 100 kg."],erro:"Deixar ele pegar o underhook."},
 {id:"p6",cat:"passagem",nome:"De meia lapela atrás da cabeça",pos:"meia",passos:["Puxe a lapela dele e passe por trás da cabeça.","Use a lapela para prender e pesar.","Solte a perna presa.","Estabilize no 100 kg."],erro:"Afrouxar a lapela antes de soltar a perna."},
 // Estrangulamento
 {id:"e1",cat:"estrang",nome:"Das costas mata-leão com trava",pos:"costas",passos:["Braço em volta do pescoço, cotovelo alinhado ao queixo dele.","A mão segura o bíceps do outro braço.","A outra mão vai atrás da cabeça dele.","Feche os cotovelos e encoste a cabeça na dele."],erro:"Fazer com o antebraço no queixo, sem chegar no pescoço."},
 {id:"e2",cat:"estrang",nome:"Da montada básico (3 formas)",pos:"montada",passos:["Primeira mão bem funda na gola, quatro dedos dentro.","Segunda mão cruzada na outra gola.","3 formas: as duas palmas para cima, as duas para baixo, ou uma de cada.","Desça os cotovelos para o chão e o peito para frente."],erro:"Pegadas rasas na gola, longe do pescoço."},
 {id:"e3",cat:"estrang",nome:"Do 100 kg mão trocada na gola",pos:"cem",passos:["Abra a gola do lado de longe.","Mão trocada (cruzada) bem funda na gola.","Antebraço atravessado no pescoço.","Gire o corpo ou caia por cima para apertar."],erro:"Soltar o controle do 100 kg para buscar a gola."},
 {id:"e4",cat:"estrang",nome:"Da guarda básico quadril",pos:"guarda",passos:["Primeira mão funda na gola, depois a segunda cruzada.","Puxe a cabeça dele para baixo com as pernas.","Mova o quadril (fuga de quadril) para fechar o ângulo.","Cotovelos abertos para fora, puxando."],erro:"Puxar só com os braços, sem mexer o quadril."},
 // Chave de pé
 {id:"c1",cat:"chavepe",nome:"Botinha reta na guarda",pos:"guarda",passos:["Ele em pé ou de joelhos na sua guarda: pegue o pé dele na axila.","Antebraço por baixo do tendão de Aquiles.","Pés no quadril dele, joelhos apertando a perna.","Arqueie as costas para trás. Não gire para o lado do pé que não está sendo atacado."],erro:"Girar para fora: é proibido na azul pela IBJJF."},
 {id:"c2",cat:"chavepe",nome:"Botinha reta da 50/50",pos:"cinquenta",passos:["Na 50/50, prenda o pé dele na sua axila.","Antebraço no tendão de Aquiles.","Joelhos apertados, controlando a perna dele.","Estenda as costas para trás, sem torcer o joelho."],erro:"Aplicar torção no calcanhar (chave de calcanhar é proibida)."},
 // Arm lock
 {id:"al1",cat:"armlock",nome:"Da guarda",pos:"guarda",passos:["Prenda o braço dele no seu peito.","Pé no quadril e gire o corpo de lado (90°).","Passe a perna por cima do rosto dele.","Joelhos fechados, polegar dele para cima e quadril para cima."],erro:"Deixar o polegar dele virado para baixo."},
 {id:"al2",cat:"armlock",nome:"Da montada",pos:"montada",passos:["Suba a montada até os braços dele.","Prenda um braço e apoie a mão no peito dele.","Gire e passe a perna por cima da cabeça.","Sente perto do ombro, joelhos fechados, e estenda o quadril."],erro:"Sentar longe do ombro dele."},
 // Triângulo
 {id:"t1",cat:"triangulo",nome:"Da guarda",pos:"guarda",passos:["Um braço dele dentro e outro fora das suas pernas.","Perna por cima do pescoço, fechando o triângulo atrás do joelho.","Ajuste o ângulo (gire o corpo) e puxe a cabeça para baixo.","Aperte os joelhos e suba o quadril."],erro:"Os dois braços dele dentro ou os dois fora."},
 {id:"t2",cat:"triangulo",nome:"Da montada",pos:"montada",passos:["Suba a montada e isole um braço.","Passe a perna por cima do braço e do pescoço.","Feche o triângulo e role de lado se precisar.","Puxe a cabeça e aperte os joelhos."],erro:"Soltar a base na transição e perder a montada."},
 // Mão de vaca
 {id:"m1",cat:"maovaca",nome:"Básica da guarda",pos:"guarda",passos:["Ele segura sua gola ou peito com a mão.","Prenda a mão dele no seu peito com as duas mãos.","Tire o ângulo do corpo.","Incline o tronco para frente, dobrando o punho dele."],erro:"Soltar a mão dele do seu peito."},
 {id:"m2",cat:"maovaca",nome:"Em pé com pegada na gola",pos:"em_pe",passos:["Ele segura a sua gola.","Prenda a mão dele na sua gola com as duas mãos.","Dê um passo para trás, mantendo a mão presa.","Incline o tronco para frente para dobrar o punho."],erro:"Puxar a mão dele para longe do corpo."},
 // Kimura / Americana
 {id:"k1",cat:"kimura",nome:"Americana do 100 kg",pos:"cem",passos:["Do 100 kg, prenda o punho dele no chão, palma para cima.","Passe o braço por baixo do braço dele e segure o seu punho.","Cotovelo dele perto do quadril dele.","Arraste a mão dele em direção ao quadril e suba o cotovelo."],erro:"Deixar o cotovelo dele longe do corpo."},
 {id:"k2",cat:"kimura",nome:"Americana da montada",pos:"montada",passos:["Prenda o punho dele no chão com a mão.","Cotovelo seu ao lado da cabeça dele.","A outra mão passa por baixo do braço e segura o seu punho.","Arraste o punho para baixo e levante o cotovelo dele."],erro:"Não manter o punho dele colado ao chão."},
 {id:"k3",cat:"kimura",nome:"Kimura da guarda",pos:"guarda",passos:["Ele apoia a mão no chão: segure o punho dele.","Sente e passe o outro braço por cima do ombro dele, segurando seu punho.","Caia de lado e feche a guarda.","Gire o braço dele para as costas."],erro:"Ficar de costas retas no chão."},
 {id:"k4",cat:"kimura",nome:"Kimura do 100 kg",pos:"cem",passos:["Isole o braço de perto dele.","Segure o punho dele e passe o braço por baixo, segurando seu punho.","Use as pernas para levantar o ombro dele, se precisar.","Gire o braço dele para as costas."],erro:"Soltar o 100 kg e deixar ele girar."},
 // Omoplata
 {id:"o1",cat:"omoplata",nome:"Da guarda",pos:"guarda",passos:["Controle a manga e coloque o pé no quadril dele.","Gire o corpo e passe a perna por cima do braço e do ombro.","Sente-se, prendendo a cintura dele para ele não rolar.","Incline para frente, girando o ombro."],erro:"Não segurar a cintura: ele rola e escapa."},
 // Crucifixo
 {id:"cr1",cat:"crucifixo",nome:"Da corujinha",pos:"tartaruga",passos:["Ele está na tartaruga (de quatro apoios) e você por cima.","Prenda um braço dele entre as suas pernas.","Prenda o outro braço com o seu braço.","Role e finalize com os braços dele presos (estrangulamento ou chave)."],erro:"Ficar alto em cima dele. Confirme com o sensei o que ele chama de \"corujinha\".",confirmar:true},
 // Defesa pessoal
 {id:"d1",cat:"defesa",nome:"Pegadas no pulso",pos:"em_pe",passos:["Não puxe na força.","Gire o pulso na direção do polegar dele (o ponto fraco da pegada).","Use o corpo todo, dobrando o cotovelo.","Saia ou controle o braço dele."],erro:"Puxar para trás contra os quatro dedos."},
 {id:"d2",cat:"defesa",nome:"Abraço pelas costas",pos:"abraco",passos:["Abaixe o quadril para ganhar base.","Prenda os braços dele contra o seu corpo.","Dê um passo para o lado e gire.","Projete-o ou controle o braço."],erro:"Ficar alto e sem base."},
 {id:"d3",cat:"defesa",nome:"Pegada no cabelo",pos:"em_pe",passos:["Prenda a mão dele contra a sua cabeça com as duas mãos.","Abaixe o tronco, indo junto com a pegada.","Gire, dobrando o punho dele.","Controle com chave de punho ou saia."],erro:"Puxar a cabeça para trás."},
 {id:"d4",cat:"defesa",nome:"Estrangulamento na guarda",pos:"guarda",passos:["Ele estrangula com as mãos no seu pescoço.","Prenda os braços dele contra o seu peito, por cima.","Puxe e quebre a postura dele com as pernas.","Saia com armlock ou trave na guarda."],erro:"Tentar empurrar o rosto dele."},
 {id:"d5",cat:"defesa",nome:"Socos",pos:"em_pe",passos:["Guarda alta e queixo protegido.","Controle a distância: longe ou colado (clinch).","Entre no clinch ou na queda quando ele socar.","Leve para o chão e controle."],erro:"Ficar na meia distância, onde o soco chega."},
 {id:"d6",cat:"defesa",nome:"Chutes",pos:"em_pe",passos:["Distância e guarda.","Bloqueie ou absorva o chute junto ao corpo.","Prenda a perna dele.","Projete com uma queda e controle no chão."],erro:"Tentar segurar o chute com as mãos esticadas."}

 {id:"h15",cat:"historia",q:"Em que cidade a B9 nasceu?",a:"São Paulo (SP)",w:["Campo Grande (MS)","Rio de Janeiro (RJ)","Belém (PA)"],ex:"A B9 nasceu em São Paulo e hoje tem filiais em outros estados e no exterior."},
 {id:"h16",cat:"historia",q:"Além do jiu-jitsu, o mestre Barbosinha é faixa preta em:",a:"Judô",w:["Karatê","Muay thai","Luta olímpica"],ex:"Por isso a B9 é conhecida pelas boas quedas."},
 {id:"h17",cat:"historia",q:"Qual é a federação estadual de jiu-jitsu de Mato Grosso do Sul?",a:"FSMJJ, a Federação Sul-Mato-Grossense de Jiu-Jitsu",w:["FJMS, a Federação de Judô de MS","CBJJ-MS","IBJJF-MS"],ex:"Cuidado: FJMS é a federação de judô. Confirme com o sensei quais federações de MS ele quer que você cite."},
 {id:"h18",cat:"historia",q:"A B9 segue as regras de qual entidade nas competições?",a:"CBJJ / IBJJF",w:["CBJJD","Federação de judô","UFC"],ex:"Os atletas da B9 competem no circuito CBJJ/IBJJF. A folha da prova também cita CBJJ / IBJJF."},
 // ÉTICA
 {id:"et1",cat:"etica",q:"Com que frequência o kimono deve ser lavado?",a:"Depois de todo treino",w:["Uma vez por semana","Só quando estiver com cheiro","Uma vez por mês"],ex:"Kimono suado guarda fungos e bactérias. Lavou, secou, treinou."},
 {id:"et2",cat:"etica",q:"Como devem estar as unhas das mãos e dos pés?",a:"Cortadas e curtas",w:["Tanto faz","Só as das mãos cortadas","Lixadas, mas compridas"],ex:"Unha comprida machuca o parceiro. A regra da IBJJF também exige unhas cortadas e curtas."},
 {id:"et3",cat:"etica",q:"Você está com micose ou outra lesão de pele contagiosa. O certo é:",a:"Não treinar até tratar e avisar o professor",w:["Treinar com camiseta por baixo","Treinar só com os amigos","Cobrir com esparadrapo e treinar"],ex:"Lesão de pele passa para o parceiro. Na competição, o fiscal manda para o médico."},
 {id:"et4",cat:"etica",q:"Cabelo comprido no treino deve estar:",a:"Preso",w:["Solto","Molhado","Com gel"],ex:"Cabelo solto atrapalha o parceiro. A regra da IBJJF também pede cabelo preso."},
 {id:"et5",cat:"etica",q:"Ao entrar e sair do tatame, o costume é:",a:"Cumprimentar o tatame, o professor e os colegas",w:["Entrar direto sem falar com ninguém","Só cumprimentar quem for treinar com você","Bater palma"],ex:"O cumprimento mostra respeito ao local, ao mestre e aos parceiros."},
 {id:"et6",cat:"etica",q:"Antes e depois de cada rola, você deve:",a:"Cumprimentar o parceiro",w:["Nada, já começa direto","Só cumprimentar se ganhar","Pedir o placar"],ex:"Cumprimentar antes e depois é a regra de ouro do respeito entre os parceiros."},
 {id:"et7",cat:"etica",q:"Calçados no tatame:",a:"Nunca. Chinelo fica na beira do tatame",w:["Podem, se estiverem limpos","Só tênis de luta","Só para o professor"],ex:"O calçado leva sujeira para o tatame, onde você encosta o rosto."},
 {id:"et8",cat:"etica",q:"Andar descalço fora do tatame (banheiro, rua) e voltar:",a:"Errado. Use chinelo fora do tatame",w:["Certo, economiza tempo","Pode, se for rápido","Só no banheiro pode"],ex:"Pé descalço no banheiro traz fungos para o tatame."},
 {id:"et9",cat:"etica",q:"Seu parceiro bateu (deu os tapinhas). O que fazer?",a:"Soltar imediatamente",w:["Apertar mais um pouco para garantir","Esperar o professor mandar","Soltar só se ele gritar"],ex:"Respeitar o tapinha é o que permite treinar sem lesão."},
 {id:"et10",cat:"etica",q:"Para desistir (bater) quando não der para usar as mãos:",a:"Bater com o pé ou falar \"bati\"",w:["Esperar o parceiro perceber","Morder","Ficar parado"],ex:"Bater com a mão, com o pé ou avisar falando. Nunca esperar machucar."},
 {id:"et11",cat:"etica",q:"Precisa sair do tatame no meio da aula:",a:"Pedir permissão ao professor",w:["Sair sem falar","Avisar só o parceiro","Sair e voltar sem avisar"],ex:"A aula é conduzida pelo professor: entrar e sair só com permissão."},
 {id:"et12",cat:"etica",q:"Com um parceiro mais leve ou iniciante, você deve:",a:"Controlar a força e cuidar dele",w:["Ir com tudo para ganhar","Recusar treinar","Usar só força"],ex:"O parceiro é quem te faz evoluir. Machucar o parceiro é falta de ética."},
 {id:"et13",cat:"etica",q:"Na rua, o jiu-jitsu deve ser usado:",a:"Só em legítima defesa, evitando a briga",w:["Para mostrar que você é bom","Sempre que alguém provocar","Para resolver discussões"],ex:"O lutador de verdade evita a briga. Humildade dentro e fora do tatame."},
 {id:"et14",cat:"etica",q:"Falar mal de outra equipe ou academia é:",a:"Falta de ética",w:["Normal, faz parte","Certo, se for verdade","Obrigatório em campeonato"],ex:"Respeito vale também para as outras equipes."},
 {id:"et15",cat:"etica",q:"Como a faixa deve ser usada no treino?",a:"Bem amarrada, por cima do kimono",w:["Só em campeonato","Dentro da calça","No pescoço"],ex:"A faixa mostra a sua graduação e deve estar sempre amarrada certinha."},

 {id:"r_d2",cat:"regras",q:"Empatou em pontos e vantagens. O que decide?",a:"Menor número de punições",w:["Decisão do árbitro","Quem finalizou mais","Sorteio"],ex:"Depois de pontos e vantagens, vence quem tiver menos punições."},

 {id:"r_f3",cat:"regras",q:"Em qual punição o atleta adulto é desclassificado?",a:"Na 4ª",w:["Na 2ª","Na 3ª","Na 5ª"],ex:"Na 4ª falta, desclassificação."},

const reuse = (ids, cat) => ids.map(id => { const q = TEO_AZUL.find(x => x.id === id); return cat ? {...q, cat} : q; });
const TEO_ROXA = [
 // REGRAS E ARBITRAGEM (situações como as da prova)
 {id:"x_r1",cat:"regras",q:"Um faixa-azul aplica um single leg e o oponente cai na área de segurança. O atleta estabiliza por cima por 3 segundos completos. O que diz a regra?",a:"O árbitro espera os 3 segundos, dá os 2 pontos da queda e reinicia no centro, na mesma posição",w:["O árbitro para a luta assim que tocam a área de segurança, sem pontos nem vantagens","O atleta ganha só uma vantagem e a luta volta em pé","O oponente é punido por sair dos limites do tatame"],ex:"Regra 4.1.3: se a queda começou com os dois pés dentro da área de luta e terminou estabilizada, valem os 2 pontos. Depois, a luta recomeça no centro na mesma posição."},
 {id:"x_r2",cat:"regras",q:"Um faixa-azul encaixa um armlock justo. Para não bater, o adversário foge correndo de propósito para fora da área de segurança. Qual é a decisão do árbitro?",a:"Desclassificar quem fugiu (falta gravíssima) e declarar o atacante vencedor",w:["Parar a luta, dar 2 pontos ao atacante e reiniciar em pé","Dar vantagem ao atacante e voltar em pé, sem punição","Voltar os dois no centro na mesma posição do armlock"],ex:"Regra 6.2.3 B: fugir de propósito da área de combate para não desistir de uma finalização é falta gravíssima, com desclassificação."},
 {id:"x_r3",cat:"regras",q:"Um faixa-azul puxa para a guarda, inverte a posição a partir da meia-guarda, mas o oponente cai de quatro apoios. Para ganhar os 2 pontos da raspagem, o que ele precisa fazer?",a:"Controlar as costas, mantendo pelo menos um joelho do oponente no chão por 3 segundos, sem precisar dos ganchos",w:["Colocar obrigatoriamente os dois ganchos nas coxas","Esperar o oponente deitar de costas, senão ganha só vantagem","Colocar o joelho na barriga do oponente em quatro apoios"],ex:"Regra 4.6.2: na raspagem que termina com o adversário em quatro apoios, basta controlar as costas com pelo menos um joelho dele no chão por 3 segundos. Gancho não é obrigatório."},
 {id:"x_r4",cat:"regras",q:"A faixa de um competidor desamarra durante a luta. Ele pode usar a faixa solta para dar uma volta no pescoço do adversário e estrangular?",a:"Não. Usar a própria faixa ou a do adversário desamarrada para ajudar no estrangulamento é falta grave",w:["Sim, se terminar o estrangulamento em menos de 10 segundos","Sim, a faixa faz parte do uniforme e vale para qualquer finalização","Só se o árbitro já tiver dado uma advertência para amarrar o uniforme"],ex:"Regra 6.2.2 S: usar a faixa desamarrada (sua ou dele) como auxílio em estrangulamento ou em qualquer situação de luta é falta grave."},
 {id:"x_r5",cat:"regras",q:"Você encaixa um triângulo e os dois rolam para a área de segurança. O que o árbitro faz?",a:"Não para a luta enquanto a finalização estiver encaixada",w:["Para e reinicia os dois em pé","Para e dá 2 pontos para você","Para e reinicia no centro na mesma posição"],ex:"Regra 1.3.7: com a finalização encaixada na área de segurança, o árbitro não interrompe o combate."},
 {id:"x_r6",cat:"regras",q:"Você ataca um armlock e é o SEU movimento que leva os dois para fora da área. O árbitro para a luta e:",a:"Dá só a vantagem pela quase finalização e reinicia em pé",w:["Dá 2 pontos para você","Desclassifica o adversário","Pune você por sair da área"],ex:"Regra 1.3.7: se a saída foi causada por quem ataca, não há 2 pontos. Fica só a vantagem, se o golpe ameaçou de verdade."},
 {id:"x_r7",cat:"regras",q:"O adversário vai passar sua guarda e você foge de propósito para fora da área de luta. O que acontece?",a:"Você recebe uma punição e o adversário ganha 2 pontos",w:["Desclassificação imediata","Nada, a luta recomeça em pé","O adversário ganha só uma vantagem"],ex:"Regra 6.2.2 M: fugir para evitar pontos do adversário é falta grave. Nesse caso, o árbitro dá 2 pontos ao adversário e marca uma punição para quem fugiu."},
 {id:"x_r8",cat:"regras",q:"Na guarda 50/50, você segura a lapela ou a faixa do adversário. Quanto tempo tem para progredir antes de ser punido?",a:"20 segundos",w:["10 segundos","30 segundos","1 minuto"],ex:"Atualização de 2024 (regra 6.2.1 F): pegou lapela ou faixa na 50/50, tem 20 segundos para progredir. Senão, punição por falta de combatividade."},
 {id:"x_r9",cat:"regras",q:"Os dois atletas puxam para a guarda ao mesmo tempo. O que o árbitro faz?",a:"Conta 20 segundos; se ninguém ficar por cima ou atacar, pune os dois e reinicia em pé",w:["Dá vantagem para quem puxou primeiro","Pune os dois na hora","Deixa a luta seguir sem limite de tempo"],ex:"Regra 6.2.1 C: puxada dupla abre contagem de 20 segundos. Sem progressão, punição para os dois e reinício em pé."},
 {id:"x_r10",cat:"regras",q:"Você derruba o adversário, cai na guarda dele e logo em seguida ele te raspa. Como fica o placar?",a:"Você ganha vantagem pela queda e ele ganha 2 pontos da raspagem",w:["Você 2 pontos e ele 2 pontos","Ninguém pontua","Você 2 pontos e ele uma vantagem"],ex:"Regra 4.1.8: queda seguida de raspagem imediata vale vantagem para quem derrubou e 2 pontos para quem raspou."},
 {id:"x_r11",cat:"regras",q:"Faixa azul ou roxa: os dois estão sentados com as pernas cruzadas em posição legal, e um deles se levanta, deixando o de baixo em cruzada de perna (pé preso). O árbitro:",a:"Interrompe e reinicia com o de baixo sentado e o outro em pé, a uma distância para novas pegadas",w:["Desclassifica o atleta de baixo","Dá 2 pontos para quem levantou","Deixa a luta seguir normalmente"],ex:"Livro de regras, cruzada de perna (até a faixa roxa): ao levantar, o pé que pisa no chão passa a contar como preso. O árbitro para e reposiciona os atletas. Confirme com o sensei se ele cobra outro detalhe."},
 {id:"x_r12",cat:"regras",q:"Colocar a mão ou o pé na parte da frente do rosto do adversário é:",a:"Falta grave",w:["Permitido","Vale vantagem para quem sofreu","Falta só na faixa preta"],ex:"Regra 6.2.2 O: mão ou pé no rosto do adversário é falta grave."},
 {id:"x_r13",cat:"regras",q:"Queda suplex que leva o adversário de cabeça ou de pescoço ao chão:",a:"Falta gravíssima: desclassificação",w:["Vale 2 pontos","Permitida a partir da roxa","Só punição no placar"],ex:"Regra 6.2.3 L: o suplex continua permitido, desde que não leve o adversário de cabeça ou pescoço ao solo."},
 {id:"x_r14",cat:"regras",q:"Tapar o nariz ou a boca do adversário com a mão:",a:"Falta gravíssima: desclassificação",w:["Permitido para sair da montada","Falta grave, só punição","Permitido se for rápido"],ex:"Regra 6.2.3 J."},
 {id:"x_r15",cat:"regras",q:"Comemorar a vitória dançando ou ridicularizando o adversário antes de o árbitro proclamar o resultado:",a:"Falta grave",w:["Permitido depois do tapinha","Só falta na faixa preta","Não tem punição"],ex:"Regra 6.2.2 X: atitudes de ridicularização, danças ou exibição de superioridade são falta grave."},
 {id:"x_r16",cat:"regras",q:"Quanto tempo dura a luta de faixa ROXA adulto?",a:"7 minutos",w:["6 minutos","8 minutos","10 minutos"],ex:"Adulto: branca 5, azul 6, roxa 7, marrom 8, preta 10 minutos."},
 {id:"x_r17",cat:"regras",q:"Um atleta é desclassificado por motivo disciplinar na categoria com kimono. O que acontece no sem kimono (No-Gi) do mesmo evento?",a:"Ele também é retirado do sem kimono",w:["Pode lutar normalmente no sem kimono","Luta, mas começa com uma punição","Precisa trocar de equipe"],ex:"Atualização de 2024: desclassificação disciplinar no kimono tira o atleta também do sem kimono."},
 {id:"x_r18",cat:"regras",q:"A chave já avançou (ou as medalhas foram entregues) e alguém pede para mudar o resultado de uma luta. Pode?",a:"Não. O resultado não pode mais ser alterado",w:["Sim, se o vídeo mostrar erro","Sim, até o fim do dia","Só se os técnicos concordarem"],ex:"Atualização de 2024: depois que a chave avança ou as medalhas são entregues, o resultado é definitivo."},
 {id:"x_r19",cat:"regras",q:"Pela atualização de 2024 da IBJJF, em que categoria de gênero o atleta deve se inscrever?",a:"Na do sexo biológico atribuído no nascimento",w:["Na que preferir","Na do peso mais próximo","Na que o técnico escolher"],ex:"É o que diz a atualização de 2024 das regras da IBJJF."},
 // GOLPES PROIBIDOS (azul e roxa adulto com kimono têm a mesma tabela)
 {id:"x_p1",cat:"proibidos",q:"Qual destas finalizações é PERMITIDA para a faixa azul e a roxa adulto em torneios da IBJJF?",a:"Mão de vaca",w:["Chave de panturrilha","Chave de bíceps","Chave de calcanhar com torção"],ex:"Mão de vaca é proibida só até 15 anos. Chave de bíceps e de panturrilha só a partir da marrom. Chave de calcanhar é proibida com kimono."},
 {id:"x_p2",cat:"proibidos",q:"Na faixa ROXA adulto com kimono, CHAVE DE JOELHO RETA (knee bar) é:",a:"Proibida",w:["Permitida","Permitida só no absoluto","Vale vantagem"],ex:"Chave de joelho reta é liberada só para marrom e preta adulto."},
 {id:"x_p3",cat:"proibidos",q:"Na faixa ROXA adulto, MATA-LEÃO NO PÉ (toe hold) é:",a:"Proibido",w:["Permitido","Permitido só na guarda","Permitido no master"],ex:"Mata-leão no pé: só marrom e preta. E mesmo nelas é proibido forçar para o lado de fora do pé."},
 {id:"x_p4",cat:"proibidos",q:"Na faixa ROXA adulto, CHAVE DE CALCANHAR é:",a:"Proibida",w:["Permitida","Permitida a partir do 2º grau","Permitida sem pontuação"],ex:"Chave de calcanhar é proibida com kimono em todas as faixas."},
 {id:"x_p5",cat:"proibidos",q:"Na faixa ROXA adulto, CHAVE DE PÉ RETA (botinha) é:",a:"Permitida, sem girar para o lado do pé que não está sendo atacado",w:["Proibida","Permitida girando para qualquer lado","Permitida só em pé"],ex:"Botinha reta é permitida a partir dos 16 anos. Girar para fora (lado do pé livre) é proibido na azul e na roxa."},
 {id:"x_p6",cat:"proibidos",q:"Na faixa ROXA adulto, CHAVE DE BÍCEPS e CHAVE DE PANTURRILHA são:",a:"Proibidas",w:["Permitidas","Permitida só a de bíceps","Permitidas só no sem kimono"],ex:"As duas só são liberadas para marrom e preta."},
 {id:"x_p7",cat:"proibidos",q:"A partir de que faixa (adulto com kimono) a chave de bíceps e a chave de joelho reta são liberadas?",a:"Marrom",w:["Roxa","Preta","Azul"],ex:"Marrom e preta adulto podem usar chave de bíceps, de panturrilha, de joelho reta e mata-leão no pé."},
 {id:"x_p8",cat:"proibidos",q:"CRUZADA DE PERNA (reaping) na faixa roxa adulto com kimono:",a:"Proibida",w:["Permitida","Permitida só na guarda 50/50","Permitida se não houver chave"],ex:"A cruzada de perna é golpe proibido para a azul e a roxa. Confira no livro a descrição: coxa por trás da perna e panturrilha passando pela frente do corpo, acima do joelho, com o pé preso."},
 {id:"x_p9",cat:"proibidos",q:"Qual destes é proibido em TODAS as faixas?",a:"Bate-estaca",w:["Omoplata","Estrangulamento Ezequiel","Mão de vaca"],ex:"Bate-estaca, chave de cervical, queda-tesoura e chave de calcanhar (com kimono) são proibidos para todos."},
 {id:"x_p10",cat:"proibidos",q:"QUEDA-TESOURA (kani basami) na faixa roxa:",a:"Proibida",w:["Permitida","Permitida só no sem kimono","Vale vantagem"],ex:"Queda-tesoura é proibida em todas as faixas."},
 {id:"x_p11",cat:"proibidos",q:"CHAVE DE CERVICAL (sem estrangulamento) na faixa roxa:",a:"Proibida",w:["Permitida","Permitida da pegada nas costas","Permitida no absoluto"],ex:"Chave de cervical é proibida."},
 {id:"x_p12",cat:"proibidos",q:"O atleta aplica um golpe proibido para a categoria dele. Qual é a consequência?",a:"Desclassificação (falta gravíssima)",w:["Punição no placar","Perde 2 pontos","Só advertência verbal"],ex:"Regra 6.2.3 M: aplicar golpe proibido para a categoria é falta gravíssima."},
 {id:"x_p13",cat:"proibidos",q:"TORCER OS DEDOS do adversário para trás:",a:"Proibido",w:["Permitido na roxa","Permitido para quebrar pegada","Vale vantagem"],ex:"Torcer os dedos para trás está na tabela de golpes proibidos."},
 {id:"x_p14",cat:"proibidos",q:"OMOPLATA e ESTRANGULAMENTO EZEQUIEL na faixa roxa adulto:",a:"Permitidos",w:["Proibidos","Só a omoplata é permitida","Só o Ezequiel é permitido"],ex:"Omoplata é proibida só até 12 anos e o Ezequiel só até 15 anos."},
 // UNIFORME E HIGIENE
 {id:"x_u1",cat:"uniforme",q:"Com os braços esticados para a frente, qual a distância máxima entre a borda da manga do paletó e o punho?",a:"2 cm da articulação do punho",w:["15 cm do punho","O paletó deve cobrir as mãos","Livre, se o paletó fechar na cintura"],ex:"Regra IBJJF 8.1.7: no máximo 2 cm do punho, com os braços a 90°. Atenção: na prova de exemplo da B9 o gabarito marcou 5 cm. Confirme com o sensei qual resposta ele espera."},
 {id:"x_u2",cat:"uniforme",q:"Um atleta chega para lutar ou treinar com o kimono sujo, com mau cheiro forte ou manchas de sangue antigas. O que vale?",a:"Ele precisa trocar por um kimono limpo no prazo; se não trocar, é desclassificado",w:["Luta normalmente, o uniforme não muda a luta","O adversário ganha 2 pontos e a luta segue","Recebe só advertência e lava para o dia seguinte"],ex:"Regra 8.1.6: o uniforme não pode estar sujo nem com mau cheiro. Sem troca no prazo, falta gravíssima (6.2.3 A)."},
 {id:"x_u3",cat:"uniforme",q:"O atleta passa creme, óleo ou gel no corpo antes da luta:",a:"Falta gravíssima: desclassificação",w:["Permitido se for hidratante","Só punição","Permitido no sem kimono"],ex:"Regra 6.2.3 F: qualquer substância escorregadia no corpo é falta gravíssima."},
 {id:"x_u4",cat:"uniforme",q:"Depois do nó da faixa, quanto cada ponta deve medir?",a:"Entre 20 e 30 cm",w:["Entre 5 e 10 cm","Entre 40 e 50 cm","Tanto faz"],ex:"Faixa de 4 a 5 cm de largura, duas voltas, nó duplo e pontas de 20 a 30 cm."},
 {id:"x_u5",cat:"uniforme",q:"Qual é a folga mínima da manga do kimono em toda a sua extensão?",a:"7 cm",w:["2 cm","15 cm","Não existe medida"],ex:"Regra 8.1.11: folga mínima de 7 cm da manga em toda a extensão."},
 {id:"x_u6",cat:"uniforme",q:"Atleta homem sem roupa de baixo, percebido pelo árbitro:",a:"Falta gravíssima: desclassificação",w:["Permitido","Só advertência","Punição no placar"],ex:"Regra 6.2.3 E."},
 {id:"x_u7",cat:"uniforme",q:"Quanto tempo o atleta tem para arrumar o paletó e a faixa antes de ser punido?",a:"20 segundos",w:["10 segundos","1 minuto","Não há limite"],ex:"Regra 6.2.2 T: 20 segundos para paletó e faixa, 20 para a faixa de identificação e 20 para amarrar a calça."},
 // GRADUAÇÃO
 {id:"x_g1",cat:"graduacao",q:"Qual é o tempo mínimo na faixa azul para chegar à roxa (IBJJF)?",a:"2 anos",w:["1 ano","3 anos","4 anos"],ex:"Azul: 2 anos. Roxa: 1 ano e meio. Marrom: 1 ano."},
 {id:"x_g2",cat:"graduacao",q:"Qual é a idade mínima para a faixa roxa?",a:"16 anos",w:["14 anos","18 anos","15 anos"],ex:"Azul e roxa: 16 anos. Marrom: 18. Preta: 19."},
 {id:"x_g3",cat:"graduacao",q:"Quanto tempo, no mínimo, o adulto fica na faixa roxa antes de ir para a marrom?",a:"1 ano e meio",w:["1 ano","2 anos","3 anos"],ex:"Roxa: mínimo de 1 ano e meio."},
 {id:"x_g4",cat:"graduacao",q:"Qual é a idade mínima para a faixa marrom?",a:"18 anos",w:["16 anos","17 anos","19 anos"],ex:"Marrom: 18 anos. Preta: 19."},
 {id:"x_g5",cat:"graduacao",q:"Como se divide a faixa roxa?",a:"Faixa lisa e mais 4 graus",w:["Faixa lisa e mais 3 graus","Só faixa lisa","Faixa lisa e mais 6 graus"],ex:"Cada faixa colorida tem a faixa lisa e até 4 graus."},
 {id:"x_g6",cat:"graduacao",q:"Quem deve aprovar o cadastro de um faixa roxa na IBJJF?",a:"Um professor faixa preta cadastrado na IBJJF",w:["Qualquer faixa marrom","O próprio atleta","O presidente da federação estadual"],ex:"A graduação é dada e registrada por professor faixa preta cadastrado."},
 {id:"x_g7",cat:"graduacao",q:"Qual é a idade mínima para a faixa preta?",a:"19 anos",w:["18 anos","21 anos","25 anos"],ex:"Preta: 19 anos, com pelo menos 1 ano na marrom."},
 // ÉTICA E CONDUTA
 {id:"x_e1",cat:"etica",q:"Um faixa-azul perde o controle depois de ser finalizado, empurra o colega e começa uma briga de verdade na academia. Qual deve ser a postura da liderança e dos mais experientes?",a:"Intervir na hora, separar, proteger os dois e aplicar medida disciplinar (suspensão ou expulsão)",w:["Deixar a briga continuar para resolver a rivalidade","Apoiar o aluno da casa se o outro for visitante","Esperar o treino acabar e conversar, sem punição, para não perder o aluno"],ex:"O tatame é lugar de evolução e respeito. Violência é intolerável."},
 {id:"x_e2",cat:"etica",q:"Como faixa roxa, qual é a sua postura com os alunos mais novos?",a:"Ser exemplo: ajudar, controlar a força e corrigir com respeito",w:["Finalizar todos para mostrar a graduação","Treinar só com os mais graduados","Corrigir o professor na frente da turma"],ex:"Quanto mais alta a faixa, maior a responsabilidade de dar exemplo."},
 {id:"x_e3",cat:"etica",q:"Durante a luta, você discorda do árbitro e reclama com gestos. Isso é:",a:"Falta grave",w:["Permitido","Direito do atleta","Só uma advertência verbal"],ex:"Regra 6.2.2 J: contestar decisão do árbitro com fala ou gestos durante a luta é falta grave."},
 {id:"x_e4",cat:"etica",q:"O professor pede para você conduzir o aquecimento da turma. Você:",a:"Conduz com seriedade e segue o padrão da academia",w:["Aproveita para treinar só o que você gosta","Recusa, porque não é sua função","Faz rápido para ir logo para o rola"],ex:"Faixas mais graduadas ajudam o professor e dão o exemplo."},

 // DEFESA PESSOAL E PRIMEIROS SOCORROS
 {id:"x_d1",cat:"defesa",q:"Na rua, o agressor te derruba, estabiliza na montada e começa a socar o seu rosto. Qual é a sequência certa?",a:"Queixo no peito e antebraços protegendo a cabeça, colar o quadril e o tronco nele, prender um braço e o pé do mesmo lado e fazer a barrigada (upa)",w:["Empurrar o peito dele com os braços esticados e chutar por baixo","Fechar os olhos, cobrir o rosto e virar de costas na hora","Socar de volta por baixo, sem travar a postura dele"],ex:"Colar no agressor tira o espaço do soco. Braço e pé do mesmo lado presos permitem a barrigada para inverter."},
 {id:"x_d2",cat:"defesa",q:"Na aula, um colega cai de mau jeito e sofre uma luxação evidente no cotovelo. Qual é o socorro imediato?",a:"Parar o treino ao redor, acalmar o colega, manter o braço na posição mais confortável, improvisar uma tipoia com paletó ou faixa e levar ao atendimento médico",w:["Puxar o braço com força para colocar no lugar","Mandar voltar a lutar para o braço voltar sozinho","Passar pomada e mandar fazer flexões"],ex:"Nunca tente colocar a articulação no lugar. Imobilize e leve ao médico."},
 {id:"x_d3",cat:"defesa",q:"Seu parceiro apaga num estrangulamento. O que fazer?",a:"Soltar na hora, deixar deitado de lado, observar a respiração e chamar o professor; se não acordar logo, ligar 192 (SAMU)",w:["Jogar água gelada e mandar voltar a treinar","Levantar de pé rápido e sacudir","Continuar apertando até ele bater"],ex:"Depois de apagar, a pessoa deve descansar e ser observada. Sem melhora rápida, socorro médico."},
 {id:"x_d4",cat:"defesa",q:"Um colega cai de cabeça e reclama de dor no pescoço e formigamento nos braços. O que fazer?",a:"Não mexer nele, manter a cabeça parada e chamar o SAMU (192)",w:["Ajudar a levantar e sentar","Massagear o pescoço","Mandar ele girar a cabeça para testar"],ex:"Suspeita de lesão na coluna: não movimente a pessoa. Chame socorro."},
 {id:"x_d5",cat:"defesa",q:"O nariz do parceiro começa a sangrar no treino. Como ajudar?",a:"Sentar, inclinar a cabeça um pouco para a frente e apertar a parte mole do nariz por alguns minutos; limpar o tatame",w:["Inclinar a cabeça para trás","Continuar o rola com o kimono sujo","Deitar de costas com a cabeça para trás"],ex:"Cabeça para a frente evita engolir sangue. Sangue no tatame e no kimono deve ser limpo antes de continuar."},
 {id:"x_d6",cat:"defesa",q:"Alguém te provoca na rua e quer briga. Qual é a primeira atitude de um faixa roxa?",a:"Evitar o confronto e sair, se puder; usar a técnica só para se defender",w:["Aceitar para mostrar a graduação","Partir para cima antes dele","Chamar os colegas da academia"],ex:"O jiu-jitsu é para defesa. Humildade e controle fazem parte da graduação."},

const KEY=B.key;

function load(){
  const base={box:{},xp:0,days:[],notes:{},answered:0,correct:0};
  try{const raw=localStorage.getItem(KEY); if(raw) return Object.assign(base,JSON.parse(raw));}catch(e){}
  return base;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function todayISO(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function markDay(){const t=todayISO(); if(!S.days.includes(t)){S.days.push(t); save();}}
function streak(){
  let n=0; const d=new Date();
  if(!S.days.includes(todayISO(d))) d.setDate(d.getDate()-1);
  while(S.days.includes(todayISO(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function daysLeft(){const t=new Date(); t.setHours(0,0,0,0); return Math.round((EXAM-t)/86400000);}
const box = id => S.box[id]||0;
function setBox(id,v){S.box[id]=Math.max(0,Math.min(4,v)); save();}

function itemsOf(cat){
  const c=CAT[cat];
  return c.tipo==="tec" ? TEC.filter(t=>t.cat===cat).map(t=>t.id) : TEO.filter(q=>q.cat===cat).map(q=>q.id);
}
function mastery(cat){const ids=itemsOf(cat); if(!ids.length) return 0; return ids.reduce((s,id)=>s+box(id),0)/(ids.length*4);}
function overall(){const ids=[...TEC.map(t=>t.id),...TEO.map(q=>q.id)]; return ids.reduce((s,id)=>s+box(id),0)/(ids.length*4);}
function graus(){const o=overall(); return o>=.95?5:o>=.8?4:o>=.6?3:o>=.4?2:o>=.2?1:0;}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
function pickWeighted(arr,n,idf){
  const pool=arr.map(x=>({x,w:Math.pow(5-box(idf(x)),2)+Math.random()}));
  pool.sort((a,b)=>b.w-a.w);
  return shuffle(pool.slice(0,n).map(p=>p.x));
}

    <line x1="2" y1="25" x2="216" y2="25" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
  </svg>`;
}

function qFromTeo(q){
  if(q.tipo==="order") return {id:q.id,cat:q.cat,tipo:"order",q:q.q,itens:q.itens,ex:q.ex};
  const opts=shuffle([{label:q.a,ok:true},...q.w.map(w=>({label:w,ok:false}))]);
  return {id:q.id,cat:q.cat,q:q.q,svg:(q.pose&&posImg(q.pose))?photoHTML(posImg(q.pose),POS_NOME[q.pose]):"",opts,ex:q.ex};
}
function qPlacar(){
  const ev=[["queda",2,"Queda"],["rasp",2,"Raspagem"],["pass",3,"Passagem de guarda"],["jb",2,"Joelho na barriga"],["mont",4,"Montada"],["costas",4,"Pegada nas costas"]];
  const seqs=[["queda","pass","mont"],["rasp","pass"],["rasp","mont"],["pass","jb"],["queda","pass","costas"],["rasp","pass","mont"],["pass","mont","costas"],["queda","jb","mont"],["rasp","costas"],["queda","rasp"]];
  const s=seqs[Math.floor(Math.random()*seqs.length)];
  const items=s.map(k=>ev.find(e=>e[0]===k));
  const total=items.reduce((a,e)=>a+e[1],0);
  const adv=Math.random()<.4;
  const wr=new Set(); while(wr.size<3){const d=[-3,-2,-1,1,2,3][Math.floor(Math.random()*6)]; if(total+d>0) wr.add(total+d);}
  return {id:"placar",cat:"regras",q:`Você fez, estabilizando 3 segundos em cada: ${items.map(e=>e[2].toLowerCase()).join(", depois ")}.${adv?" Ainda ganhou 1 vantagem.":""} Quantos PONTOS você tem?`,
    opts:shuffle([{label:`${total} pontos`,ok:true},...[...wr].map(v=>({label:`${v} pontos`,ok:false}))]),
    ex:items.map(e=>`${e[2]} = ${e[1]}`).join(" + ")+` = ${total}.${adv?" Vantagem não soma ponto, só desempata.":""}`};
}
function qPosicao(){
  const keys=Object.keys(POSIMG);
  const names=["guarda","montada","cem","costas","meia","borboleta","joelho","cinquenta","tartaruga"];
  const k=keys[Math.floor(Math.random()*keys.length)];
  const wr=shuffle(names.filter(x=>x!==k)).slice(0,3);
  return {id:"pos_"+k,cat:"regras",q:"Que posição é essa?",svg:photoHTML(posImg(k),"Foto de jiu-jitsu"),opts:shuffle([{label:POS_NOME[k],ok:true},...wr.map(w=>({label:POS_NOME[w],ok:false}))]),ex:`É ${POS_NOME[k].toLowerCase()}.`,noBox:true};
}
// nome completo da técnica, como o sensei chama na prova
const fullName = t => `${CAT[t.cat].nome}: ${t.nome}`;
const semConfirme = s => s.replace(/\s*Confirme com o sensei.*$/,"");
// 1) assiste ao vídeo e diz qual técnica é
function qVideo(t){
  const outros=shuffle(TEC.filter(x=>VID[x.id]&&x.id!==t.id)).slice(0,3);
  return {id:t.id,cat:t.cat,hideCat:true,q:"Assista ao vídeo. Que técnica da prova é essa?",svg:videoHTML(VID[t.id],"Vídeo de técnica"),
    opts:shuffle([{label:fullName(t),ok:true},...outros.map(o=>({label:fullName(o),ok:false}))]),
    ex:`É ${fullName(t)}. ${t.passos[0]}`};
}
// 2) coloca os passos na ordem
function qOrdem(t){
  return {id:t.id,cat:t.cat,tipo:"order",long:true,q:`Coloque os passos na ordem: ${fullName(t)}`,
    svg:VID[t.id]?videoHTML(VID[t.id],t.nome):"",itens:t.passos,ex:`Erro comum: ${t.erro}`};
}
// 3) reconhece o erro comum
function qErro(t){
  const outros=shuffle(TEC.filter(x=>x.cat!==t.cat)).slice(0,3).map(x=>semConfirme(x.erro));
  return {id:t.id,cat:t.cat,q:`Qual é o erro mais comum em ${fullName(t)}?`,svg:VID[t.id]?videoHTML(VID[t.id],t.nome):"",
    opts:shuffle([{label:semConfirme(t.erro),ok:true},...outros.map(o=>({label:o,ok:false}))]),
    ex:"Passos certos: "+t.passos.join(" ")};
}
// 4) olha a foto da posição e escolhe a técnica que começa nela
function qDeOnde(t){
  const outros=shuffle(TEC.filter(x=>x.pos!==t.pos&&x.pos!=="solo")).slice(0,3);
  return {id:t.id,cat:t.cat,hideCat:true,q:"Olhe a posição da foto. Qual destas técnicas da prova começa nela?",svg:photoHTML(posImg(t.pos),"Foto de posição de jiu-jitsu"),
    opts:shuffle([{label:fullName(t),ok:true},...outros.map(o=>({label:fullName(o),ok:false}))]),
    ex:`A foto mostra ${POS_NOME[t.pos].toLowerCase()}. Daqui sai ${fullName(t)}. ${t.passos[0]}`};
}
function qTecnica(t){
  const tipos=[qOrdem,qErro];
  if(VID[t.id]) tipos.push(qVideo,qVideo);
  if(posImg(t.pos) && t.pos!=="queda") tipos.push(qDeOnde);
  return tipos[Math.floor(Math.random()*tipos.length)](t);
}

let Q=null;
function startQuiz(mode){
  let list=[];
  const teoCat=c=>pickWeighted(TEO.filter(q=>q.cat===c),10,q=>q.id).map(qFromTeo);
  if(mode==="dia"){
    const foco=weakest(3).map(c=>c.id);
    const tecs=pickWeighted(TEC.filter(t=>foco.includes(t.cat)).concat(TEC),3,t=>t.id).map(qTecnica);
    const teo=pickWeighted(TEO,10-tecs.length,q=>q.id).map(qFromTeo);
    list=shuffle([...teo,...tecs,qPlacar(),qPosicao()]);
  } else if(CATS.some(c=>c.id===mode&&c.tipo==="teoria")) list=teoCat(mode);
  else if(mode==="placar") list=Array.from({length:6},qPlacar);
  else if(mode==="posicao") list=Array.from({length:8},qPosicao);
  else if(mode==="video") list=pickWeighted(TEC.filter(t=>VID[t.id]),10,t=>t.id).map(qVideo);
  else if(mode==="tecq") list=pickWeighted(TEC,10,t=>t.id).map(qTecnica);
  else if(CAT[mode]) list=pickWeighted(TEC.filter(t=>t.cat===mode),6,t=>t.id).map(qTecnica);
  Q={mode,list,i:0,hits:0,xp:0};
  route="quiz"; showQ();
}

function showQ(){
  const q=Q.list[Q.i];
  if(!q) return quizEnd();
  const pct=Q.i/Q.list.length*100;
  const catLbl=q.hideCat?"Técnicas":q.cat?CAT[q.cat].nome:"";
  app.innerHTML=`<div class="qtop"><button class="xbtn" id="qx" aria-label="Sair do quiz">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="belt-meta">${Q.i+1}/${Q.list.length}</span></div>
  <div class="qcat">${esc(catLbl)}</div>
  <div class="qtext">${esc(q.q)}</div>
  ${q.svg?`<div class="figure">${q.svg}</div>`:""}
  <div id="qbody"></div><div id="qfb"></div>`;
  $("#qx").onclick=()=>go("quiz");
  if(q.tipo==="order") return orderQ(q);
  const body=$("#qbody");
  body.innerHTML=`<div class="opts ${q.grid?"grid":""}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.svg?o.svg:esc(o.label)}</button>`).join("")}</div>`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=q.opts[+b.dataset.i];
    body.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true; if(q.opts[i].ok) x.classList.add("correct");});
    if(!o.ok) b.classList.add("wrong");
    answer(q,o.ok, q.grid ? `Resposta: ${q.opts.find(x=>x.ok).label}. ${q.ex}` : q.ex);
  });
}
function orderQ(q){
  const picked=[]; const body=$("#qbody");
  body.classList.toggle("order-long",!!q.long);
  let pool=shuffle(q.itens);
  while(q.itens.length>1 && pool.every((s,i)=>s===q.itens[i])) pool=shuffle(q.itens);
  const draw=()=>{
    const isBelt=s=>BELT_COLOR[s.split(":")[0]];
    const chip=(s,on)=>`<button class="chip ${on?"on":""}" data-s="${esc(s)}">${isBelt(s)&&!s.includes(":")?`<span class="belt-chip"><i style="background:${BELT_COLOR[s]}"></i>${esc(s)}</span>`:esc(s)}</button>`;
    body.innerHTML=`<div class="order-picked" aria-label="Sua ordem">${picked.length?picked.map((s,i)=>`<span class="chip on">${i+1}. ${esc(s)}</span>`).join(""):'<span class="belt-meta" style="padding:8px">Toque nos itens na ordem certa</span>'}</div>
      <div class="row" style="flex-wrap:wrap">${pool.filter(s=>!picked.includes(s)).map(s=>chip(s,false)).join("")}</div>
      ${picked.length?'<button class="btn" id="undo" style="margin-top:10px">Desfazer</button>':""}`;
    body.querySelectorAll(".row .chip").forEach(c=>c.onclick=()=>{picked.push(c.dataset.s); if(picked.length===q.itens.length) finish(); else draw();});
    const u=$("#undo"); if(u) u.onclick=()=>{picked.pop(); draw();};
  };
  const finish=()=>{
    const ok=picked.every((s,i)=>s===q.itens[i]);
    body.innerHTML=`<div class="order-picked">${picked.map((s,i)=>`<span class="chip" style="border-color:${s===q.itens[i]?"var(--ok)":"var(--bad)"};border-width:2px">${i+1}. ${esc(s)}</span>`).join("")}</div>`;
    answer(q,ok,(ok?"":"Ordem certa: "+q.itens.join(" → ")+". ")+q.ex);
  };
  draw();
}
function answer(q,ok,ex){
  S.answered++; if(ok){S.correct++; Q.hits++; Q.xp+=10; gain(10);} else {markDay(); save();}
  if(!q.noBox && q.id!=="placar") setBox(q.id, ok? box(q.id)+1 : 0);
  const fb=$("#qfb");
  const msgs=ok?["Oss! Acertou","Isso aí!","Finalizou!","Na técnica!"]:["Quase!","Bateu! Vamos de novo","Não foi dessa vez"];
  fb.innerHTML=`<div class="feedback ${ok?"ok":"no"} pop"><b>${msgs[Math.floor(Math.random()*msgs.length)]}${ok?" +10 XP":""}</b>${esc(ex||"")}</div>
  <button class="btn btn-primary btn-wide next" id="nx">${Q.i+1<Q.list.length?"Próxima":"Ver resultado"}</button>`;
  $("#nx").onclick=()=>{Q.i++; showQ();};
  $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function quizEnd(){
  if(Q.onEnd) return Q.onEnd();
  const n=Q.list.length, p=Math.round(Q.hits/n*100);
  const bonus = p===100?20:0; if(bonus) gain(bonus);
  const frase = p>=90?`Nível faixa ${B.nome.toLowerCase()}. Oss!`:p>=70?"Bom treino! Revise o que errou.":p>=50?"No caminho. Repita amanhã.":"Volta pro drill: repita este quiz.";
  app.innerHTML=`<div class="result"><div class="qcat">Resultado</div><div class="big">${Q.hits}/${n}</div><h2 style="font-size:26px">${frase}</h2>
  <p class="belt-meta">+${Q.xp+bonus} XP${bonus?" (bônus de gabarito!)":""}</p>
  <div class="row" style="width:100%"><button class="btn" id="bk">Voltar</button><button class="btn btn-primary" id="again">Repetir</button></div></div>`;
  $("#bk").onclick=()=>go("quiz"); $("#again").onclick=()=>startQuiz(Q.mode);
}

const lvl=id=>{const b=box(id); return S.box[id]===undefined?0:b>=4?3:b>=2?2:1;};

/* IndexedDB para fotos e vídeos */
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res)=>{try{const r=indexedDB.open("rumoazul",1); r.onupgradeneeded=()=>r.result.createObjectStore("m"); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);}});
  return dbp;
}
async function putMedia(id,file){const d=await db(); if(!d){toast("Este navegador não deixou salvar"); return;} return new Promise(r=>{try{const tx=d.transaction("m","readwrite"); tx.objectStore("m").put(file,id); tx.oncomplete=r; tx.onerror=r;}catch(e){r();}});}
async function getMedia(id){const d=await db(); if(!d) return null; return new Promise(r=>{try{const q=d.transaction("m").objectStore("m").get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null);}catch(e){r(null);}});}
async function delMedia(id){const d=await db(); if(!d) return; return new Promise(r=>{try{const tx=d.transaction("m","readwrite"); tx.objectStore("m").delete(id); tx.oncomplete=r;}catch(e){r();}});}
async function showMedia(id,el){
  const f=await getMedia(id);
  if(!f){el.innerHTML=""; return;}
  const url=URL.createObjectURL(f);
  el.innerHTML=(f.type||"").startsWith("video")?`<video src="${url}" controls playsinline></video>`:`<img src="${url}" alt="Sua foto da técnica">`;
  const b=document.createElement("button"); b.className="btn"; b.textContent="Remover"; b.onclick=async()=>{await delMedia(id); showMedia(id,el);};
  el.appendChild(b);
}

function simDraw(){
  clearInterval(timerId);
  const t=SIM.list[SIM.i];
  if(!t || (SIM.tipo==="prova" && SIM.i>=SIM.list.length)) return simTheory();
  app.innerHTML=`<div class="qtop"><button class="xbtn" id="sx" aria-label="Sair do simulado">✕</button><div class="bar"><i style="width:${SIM.tipo==="prova"?SIM.i/SIM.list.length*100:0}%"></i></div><span class="belt-meta">${SIM.tipo==="prova"?(SIM.i+1)+"/"+SIM.list.length:"Técnica "+(SIM.i+1)}</span></div>
  <div class="wheel" id="wheel"><div class="sensei">O sensei chamou:</div><div class="cat" id="wc">...</div><div class="name" id="wn">...</div></div>
  <div id="sbody"></div>`;
  $("#sx").onclick=()=>go("sim");
  const wn=$("#wn"), wc=$("#wc"); let k=0;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const spin=setInterval(()=>{const r=TEC[Math.floor(Math.random()*TEC.length)]; wn.textContent=r.nome; wc.textContent=CAT[r.cat].nome; if(++k>14||reduce){clearInterval(spin); land();}},70);
  function land(){
    wn.textContent=t.nome; wc.textContent=CAT[t.cat].nome; $("#wheel").classList.add("pop");
    let left=30;
    $("#sbody").innerHTML=`<div class="timer" id="tm">0:30</div><p class="belt-meta" style="text-align:center;margin:0 0 10px">Execute ou explique em voz alta, sem olhar.</p>
      <button class="btn btn-primary btn-wide" id="rev">Conferir os passos</button>`;
    timerId=setInterval(()=>{left--; const el=$("#tm"); if(!el){clearInterval(timerId);return;} el.textContent="0:"+String(Math.max(left,0)).padStart(2,"0"); if(left<=0){clearInterval(timerId); el.textContent="Tempo!";}},1000);
    $("#rev").onclick=reveal;
  }
  function reveal(){
    clearInterval(timerId);
    const m=tecMedia(t);
    $("#sbody").innerHTML=`${m?`<div class="figure" style="margin-top:12px">${m.html}</div>`:""}<a class="btn btn-wide yt" href="${ytURL(t)}" target="_blank" rel="noopener" style="margin:10px 0">▶ Ver no YouTube</a><ol class="steps">${t.passos.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
    <div class="warn"><b>Erro comum:</b> ${esc(t.erro)}</div>
    <div class="sub">Como você foi?</div>
    <div class="rate"><button class="l1" data-v="0">Travei</button><button class="l2" data-v="1">Quase</button><button class="l3" data-v="2">Executei</button></div>`;
    app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      const v=+b.dataset.v; SIM.score+=v/2;
      setBox(t.id, v===2?box(t.id)+1:v===1?Math.max(box(t.id),1):0); gain(v*5);
      SIM.i++; simDraw();
    });
  }
}
function simTheory(){
  if(SIM.tipo!=="prova") return go("sim");
  const tecScore=SIM.score/SIM.list.length;
  const list=pickWeighted(TEO.filter(q=>q.tipo!=="order"),12,q=>q.id).map(qFromTeo);
  Q={mode:"prova",list,i:0,hits:0,xp:0,tecScore};
  showQ();
  // ao final, mostra a nota combinada
  Q.onEnd=function(){
    const teo=Q.hits/Q.list.length, nota=Math.round((tecScore*.5+teo*.5)*100)/10;
    const ok=nota>=7;
    app.innerHTML=`<div class="result"><div class="qcat">Nota do simulado</div><div class="big" style="color:${ok?"var(--ok)":"var(--red)"}">${nota.toFixed(1)}</div>
      <h2 style="font-size:26px">${ok?"Aprovado! Oss!":"Ainda não. Bora treinar!"}</h2>
      <p class="belt-meta">Técnicas: ${Math.round(tecScore*100)}% · Teoria: ${Q.hits}/${Q.list.length}</p>
      <div class="row" style="width:100%"><button class="btn" id="bk">Voltar</button><button class="btn btn-primary" id="again">Nova prova</button></div></div>`;
    $("#bk").onclick=()=>go("sim");
    $("#again").onclick=()=>{SIM={tipo:"prova",list:pickWeighted(TEC,8,t=>t.id),i:0,score:0}; simDraw();};
  };
}

document.title = "Rumo à Faixa " + B.nome;
if(FAIXA) go("home"); else picker();
</script>
